name: Deploy ERP

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 600s
          script: |
            set -e
            BENCH_DIR="/srv/apps/erp/backend/rolaface-izayne-bench"
            BENCH="/home/frappe/.local/bin/bench"

            export PYTHONPATH="/home/frappe/.local/lib/python3.14/site-packages"
            export NVM_DIR="/home/frappe/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm use 24

            cd "$BENCH_DIR"

            echo "⬇️ Pull latest code..."
            git config --global --add safe.directory "$BENCH_DIR/apps/custom_api"
            cd "$BENCH_DIR/apps/custom_api"
            git fetch origin staging && git reset --hard origin/staging || { echo "❌ Git pull failed"; exit 1; }
            cd "$BENCH_DIR"

            echo "🎨 Build assets..."
            $BENCH build --verbose 2>&1 | grep -v "Browserslist: caniuse-lite is outdated" || true

            SITES=$(ls "$BENCH_DIR/sites/" | grep -E "^api\.")

            echo "🌐 Sites found:"
            echo "$SITES"

            for SITE in $SITES; do
              echo ""
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              echo "🌐 Processing: $SITE"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

              echo "📦 Backup..."
              $BENCH --site "$SITE" backup || { echo "❌ Backup failed: $SITE"; exit 1; }

              echo "🔧 Running patches..."
              $BENCH --site "$SITE" run-patch custom_api.patches.v1_0.create_batch_barcode_field

              echo "⚙️ Migrating..."
              $BENCH --site "$SITE" migrate || { echo "❌ Migration failed: $SITE"; exit 1; }
              echo "✅ Migration done: $SITE"

              echo "🧹 Clear cache..."
              $BENCH --site "$SITE" clear-cache || { echo "❌ Clear cache failed: $SITE"; exit 1; }

            done

            echo ""
            echo "🔄 Restarting services..."
            supervisorctl restart "rolaface-izayne-bench-web:*" "rolaface-izayne-bench-workers:*" || { echo "❌ Service restart failed"; exit 1; }

            echo "✅ Deploy complete!"